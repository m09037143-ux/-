# Боевой стек «Правовой Поток» для одного сервера (VPS): HTTPS-прокси + приложение + воркер + PostgreSQL + Redis.
# Запуск и все шаги — deploy/README.md. Секреты — только в deploy/.env (в git не попадает).
#
#   cd deploy && docker compose -f docker-compose.prod.yml up -d --build
#
# Наружу открыты только порты 80 и 443 (Caddy). База и Redis доступны лишь внутри сети compose.

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  env_file: .env
  environment: &app-env
    ENVIRONMENT: production
    DATABASE_URL: postgresql+asyncpg://pravovoy_potok:${POSTGRES_PASSWORD}@db:5432/pravovoy_potok
    REDIS_URL: redis://redis:6379/0
    # Приложение стоит ЗА прокси: доверяем заголовкам X-Forwarded-* (порт приложения наружу не опубликован),
    # иначе все пользователи для ограничений входа и регистрации выглядели бы одним адресом — адресом Caddy.
    FORWARDED_ALLOW_IPS: "*"
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    <<: *app
    command: ["./docker-entrypoint.sh"] # сначала миграции базы (alembic upgrade head), затем сервер
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s

  worker:
    <<: *app
    command: ["python", "-m", "app.worker.runner"] # сбор по кнопке и расписанию, автоматические черновики, догонка
    depends_on:
      app:
        condition: service_healthy # миграции уже применены
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    # Версия сервера должна быть НЕ НИЖЕ версии базы на Render (дамп новее сервера не восстановится);
    # версию Render смотрите на странице базы в панели Render (README, шаг про перенос данных).
    # База на Render — PostgreSQL 18, поэтому здесь 18. Образ 18+ хранит данные в /var/lib/postgresql/18/docker,
    # том монтируется на /var/lib/postgresql (а не на .../data, как у версий до 18).
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pravovoy_potok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pravovoy_potok
    volumes:
      - pp_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pravovoy_potok -d pravovoy_potok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

# Сеть контейнеров с MTU меньше, чем у сетевой карты VPS (1450 у Рег.облака): иначе крупные пакеты из контейнеров
# теряются, и HTTPS к части внешних сайтов (источники новостей, Яндекс, Render) зависает по таймауту.
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"

volumes:
  pp_db_data:
  caddy_data:
  caddy_config:
