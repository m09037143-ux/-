version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pravovoy_potok
      POSTGRES_PASSWORD: dev_local_only
      POSTGRES_DB: pravovoy_potok
    ports:
      - "5432:5432"
    volumes:
      - pp_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pravovoy_potok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: .
    command: python -m app.worker.runner
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pp_db_data:
