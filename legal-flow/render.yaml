# Render.com Blueprint — разворачивает backend API (он же отдаёт frontend,
# см. app/main.py — вся статика идёт из того же процесса, одним доменом)
# и PostgreSQL. Redis (переменная REDIS_URL) сюда тоже не включён — заводится
# отдельно (New → Key Value) и используется ТОЛЬКО этим API-процессом, для
# rate limit, по внутреннему (Internal) адресу. Фоновый worker
# (app/worker/runner.py) сюда НЕ включён — у Render нет бесплатного тарифа
# для Background Worker, поэтому по решению владельца worker продолжает
# работать локально, подключаясь к этой же базе по внешнему (External)
# адресу — Redis worker'у не нужен вообще, он опрашивает таблицу scan_jobs
# напрямую. Подробная пошаговая инструкция — docs/DEPLOY_RENDER.md (там же —
# почему часть переменных окружения помечена sync: false и заполняется
# вручную в панели Render).

databases:
  - name: pravovoy-potok-db
    databaseName: pravovoy_potok
    user: pravovoy_potok
    plan: free

services:
  - type: web
    name: pravovoy-potok-api
    env: docker
    rootDir: legal-flow
    dockerfilePath: ./Dockerfile
    dockerCommand: ./docker-entrypoint.sh
    plan: free
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CSRF_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: LLM_PROVIDER
        value: yandexgpt_pro_5_1
      - key: YANDEX_FOLDER_ID
        sync: false
      - key: YANDEX_MODEL_URI
        sync: false
      - key: YANDEX_API_KEY
        sync: false
      - key: LLM_FIXTURE_MODE
        value: "false"
      - key: PAYMENT_PROVIDER
        value: not_configured
      - key: LOG_LEVEL
        value: INFO
