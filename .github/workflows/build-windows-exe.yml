name: Build Windows .exe

# Builds the single-file RepairReportApp.exe ON a real Windows runner
# (PyInstaller does not cross-compile -- this is why the .exe itself is
# never committed to the repo, only the source + build spec are; see
# packaging/BUILD.md). Trigger manually from the Actions tab, or push
# touching the app/packaging paths.
on:
  workflow_dispatch: {}
  push:
    branches: ["**"]
    paths:
      - "repair_report/**"
      - "main.py"
      - "requirements.txt"
      - "packaging/**"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      # WeasyPrint (PDF export) needs Pango/GObject/HarfBuzz/FontConfig
      # native DLLs on Windows -- see packaging/BUILD.md's GTK3-runtime
      # caveat. These are loaded via ctypes.util.find_library() at RUNTIME,
      # not a normal Python import, so PyInstaller's static analysis can't
      # see them and won't bundle them on its own.
      #
      # Two things were tried and rejected here before this one, kept as a
      # cautionary note since the names are misleading:
      #   1. `choco install gtk-runtime` -- despite the name, this
      #      chocolatey package installs **GTK2** (v2.24.10 from 2012, an
      #      old SourceForge build), not GTK3. Silently wrong, not merely
      #      out of date.
      #   2. A same-filename search for libgobject-2.0-0.dll across
      #      Program Files -- windows-latest images already carry a stale
      #      GTK2-Runtime elsewhere, which matches the filename but not
      #      the actual GObject/Pango ABI WeasyPrint needs.
      # This step uses MSYS2 + pacman instead, WeasyPrint's own documented
      # route for Windows (see
      # https://doc.courtbouillon.org/weasyprint/stable/first_steps.html#windows)
      # -- it installs the real mingw-w64 Pango/GObject/HarfBuzz/FontConfig
      # build at a known, fixed path.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-pango

      - name: Locate GTK3 (MSYS2/mingw64) runtime DLLs and export GTK_RUNTIME_BIN
        shell: pwsh
        run: |
          # Try the well-known install locations first (fast, no scanning).
          $fixed = @(
            "C:\msys64\mingw64\bin",
            "D:\msys64\mingw64\bin",
            "C:\tools\msys64\mingw64\bin",
            "$env:RUNNER_TEMP\msys64\mingw64\bin"
          )
          $bin = $fixed | Where-Object { Test-Path (Join-Path $_ "libgobject-2.0-0.dll") } | Select-Object -First 1

          if (-not $bin) {
            # Fall back to a bounded search (only under a "msys64" top
            # directory, so this doesn't scan the whole drive) in case the
            # action's default location ever changes. Still requires
            # libpango alongside libgobject as a completeness check.
            $candidates = Get-ChildItem -Path "C:\msys64*","D:\msys64*" -Filter "libgobject-2.0-0.dll" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.DirectoryName -match 'mingw64' } |
              Where-Object { Test-Path (Join-Path $_.DirectoryName "libpango-1.0-0.dll") }
            if ($candidates) {
              $bin = ($candidates | Select-Object -First 1).DirectoryName
            }
          }

          if (-not $bin) {
            Write-Error "No usable mingw64 Pango/GObject directory found after the MSYS2 pango install -- WeasyPrint/PDF export would be broken in the built .exe. Failing the build instead of shipping it silently broken (see packaging/BUILD.md)."
            exit 1
          }
          Write-Host "Found GTK3 (MSYS2 mingw64) runtime bin directory: $bin"
          Get-ChildItem $bin -Filter "*.dll" | Select-Object -First 10 | ForEach-Object { Write-Host "  $($_.Name)" }
          echo "GTK_RUNTIME_BIN=$bin" >> $env:GITHUB_ENV
          # Also put it on PATH for the rest of this job, so the sanity-
          # check step below actually exercises THIS SAME install (the one
          # that will be bundled), not whatever happens to be ambiently
          # first on PATH already.
          echo "$bin" >> $env:GITHUB_PATH

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Sanity-check weasyprint imports on this runner
        run: python -c "import weasyprint; print('weasyprint OK:', weasyprint.__version__)"

      - name: Build single-file .exe
        run: |
          pyinstaller packaging/repair_report_onefile.spec --distpath dist --workpath build

      - name: Upload RepairReportApp.exe
        uses: actions/upload-artifact@v4
        with:
          name: RepairReportApp-windows-exe
          path: dist/RepairReportApp.exe
          if-no-files-found: error
