name: Build Windows .exe

# Builds the single-file RepairReportApp.exe ON a real Windows runner
# (PyInstaller does not cross-compile -- this is why the .exe itself is
# never committed to the repo, only the source + build spec are; see
# packaging/BUILD.md). Trigger manually from the Actions tab, or push
# touching the app/packaging paths.
on:
  workflow_dispatch: {}
  push:
    branches: ["**"]
    paths:
      - "repair_report/**"
      - "main.py"
      - "requirements.txt"
      - "packaging/**"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      # WeasyPrint (PDF export) needs Pango/GObject/HarfBuzz/FontConfig
      # native DLLs on Windows -- see packaging/BUILD.md's GTK3-runtime
      # caveat. These are loaded via ctypes.util.find_library() at RUNTIME,
      # not a normal Python import, so PyInstaller's static analysis can't
      # see them and won't bundle them on its own (this is exactly what
      # produced "cannot load library 'libgobject-2.0-0'" on a clean
      # Windows machine the first time this was built). Installing GTK
      # here lets the build machine import weasyprint at all; the next
      # step finds the resulting DLLs so the .spec can bundle them INTO
      # the .exe, so an end user's machine doesn't need GTK installed too.
      - name: Install WeasyPrint native dependencies (GTK3 runtime)
        run: choco install gtk-runtime -y --no-progress

      - name: Locate GTK3 runtime DLLs and export GTK_RUNTIME_BIN
        shell: pwsh
        run: |
          # windows-latest images ship a STALE GTK2-Runtime under
          # "Program Files (x86)" (pre-existing, unrelated to the
          # gtk-runtime choco package just installed above) that also
          # happens to contain a file named libgobject-2.0-0.dll -- an
          # earlier version of this search picked that one up first
          # (Select-Object -First 1 with no filtering) and bundled an
          # incompatible GTK2 DLL, which still failed to load. Exclude any
          # "GTK2" path explicitly, and require BOTH libgobject and
          # libpango to be present in the same directory as a sanity check
          # that it's a real, complete GTK3 runtime rather than a stray
          # same-named file.
          $candidates = Get-ChildItem -Path "C:\Program Files*","C:\ProgramData\chocolatey*" -Filter "libgobject-2.0-0.dll" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -notmatch 'GTK2' } |
            Where-Object { Test-Path (Join-Path $_.DirectoryName "libpango-1.0-0.dll") }

          if (-not $candidates) {
            Write-Error "No usable GTK3 runtime directory found (with both libgobject-2.0-0.dll and libpango-1.0-0.dll, excluding any stale GTK2-Runtime) after installing gtk-runtime -- WeasyPrint/PDF export would be broken in the built .exe. Failing the build instead of shipping it silently broken (see packaging/BUILD.md)."
            exit 1
          }
          # If multiple valid candidates exist, prefer one whose path
          # actually says "GTK3".
          $dll = $candidates | Sort-Object { if ($_.DirectoryName -match 'GTK3') { 0 } else { 1 } } | Select-Object -First 1
          $bin = $dll.DirectoryName
          Write-Host "Found GTK3 runtime bin directory: $bin"
          Get-ChildItem $bin -Filter "*.dll" | ForEach-Object { Write-Host "  $($_.Name)" }
          echo "GTK_RUNTIME_BIN=$bin" >> $env:GITHUB_ENV
          # Also put it on PATH for the rest of this job, so the sanity-
          # check step below actually exercises THIS SAME GTK3 install
          # (the one that will be bundled), not whatever happens to be
          # ambiently first on PATH already.
          echo "$bin" >> $env:GITHUB_PATH

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Sanity-check weasyprint imports on this runner
        run: python -c "import weasyprint; print('weasyprint OK:', weasyprint.__version__)"

      - name: Build single-file .exe
        run: |
          pyinstaller packaging/repair_report_onefile.spec --distpath dist --workpath build

      - name: Upload RepairReportApp.exe
        uses: actions/upload-artifact@v4
        with:
          name: RepairReportApp-windows-exe
          path: dist/RepairReportApp.exe
          if-no-files-found: error
